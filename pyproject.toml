[project]
name = "alphawheel"
version = "0.1.0"
description = "Autonomous AI Wheel Strategy Trading Agent for Alpaca"
requires-python = ">=3.11,<4.0.0"
dependencies = [
    "alpaca-py>=0.33.0",
    "google-genai>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "streamlit>=1.30.0",
    "aiohttp>=3.9.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.1.0"]

[project.scripts]
alphawheel = "alphawheel.cli.commands:app"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
